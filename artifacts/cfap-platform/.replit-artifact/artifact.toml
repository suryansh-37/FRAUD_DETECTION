kind = "web"
previewPath = "/"
title = "CFAP — Crypto Fraud Attribution Platform"
description = "A role-aware investigation workspace for tracing illicit crypto funds, coordinating VASP notices, and preserving court-ready evidence across cybercrime teams."
version = "1.0.0"
id = "artifacts/cfap-platform"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20215

[services.development]
run = "pnpm --filter @workspace/cfap-platform run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cfap-platform", "run", "build" ]
serve = "static"
publicDir = "artifacts/cfap-platform/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20215"
BASE_PATH = "/"
